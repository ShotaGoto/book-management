services:
  - type: web
    name: book-management-api
    runtime: go
    rootDir: backend
    buildCommand: go mod tidy && go build -o server ./cmd/api
    startCommand: ./server
    envVars:
      - key: DATABASE_URL
        sync: false   # Render ダッシュボードで Supabase の接続文字列を設定
      - key: CORS_ALLOW_ORIGINS
        sync: false   # 例: https://your-project.pages.dev
